---
# Deploys MM Project Tracker to WordPress over FTPS whenever main changes.
#
# FTP_SERVER_DIR must be the installed plugin directory as the deploy account
# sees it after login. If the account starts in wp-content/plugins/, use
# /mm-project-tracker/. The trailing slash is added automatically if omitted.
#
# FTP-Deploy-Action stores .ftp-deploy-sync-state.json in that directory and
# uses it to upload only changed files. Do not delete the state file unless a
# full re-upload is intended.

name: Deploy to WordPress

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - '.github/**'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview only — log changes without uploading them'
        type: boolean
        default: false
      protocol:
        description: 'Connection type'
        type: choice
        default: ftps
        options: [ ftps, ftp, ftps-legacy ]
      port:
        description: 'Port (21 for ftp/ftps, 990 for ftps-legacy)'
        type: string
        default: '21'
      log_level:
        description: 'Deployment log detail'
        type: choice
        default: standard
        options: [ standard, verbose ]
      allow_create:
        description: 'Allow a genuine first deployment into an empty folder'
        type: boolean
        default: false

concurrency:
  group: project-tracker-ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: FTPS upload
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Verify secrets and normalise target path
        id: ftp
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          missing=""
          for name in FTP_SERVER FTP_USERNAME FTP_PASSWORD FTP_SERVER_DIR; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done

          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing — add them under Settings → Secrets and variables → Actions."
            exit 1
          fi

          case "$FTP_SERVER_DIR" in
            */) server_dir="$FTP_SERVER_DIR" ;;
            *)  server_dir="$FTP_SERVER_DIR/" ;;
          esac

          echo "::add-mask::$server_dir"
          echo "server-dir=$server_dir" >> "$GITHUB_OUTPUT"

      # The deploy action creates missing directories. This preflight prevents
      # a mistyped path from producing a successful upload that WordPress never
      # loads.
      - name: Verify target is the installed plugin folder
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ steps.ftp.outputs.server-dir }}
          PROTOCOL: ${{ inputs.protocol || 'ftps' }}
          PORT: ${{ inputs.port || '21' }}
          ALLOW_CREATE: ${{ inputs.allow_create || false }}
        run: |
          if [ "true" = "$ALLOW_CREATE" ]; then
            echo "allow_create is set — skipping the installed-plugin check."
            exit 0
          fi

          case "$PROTOCOL" in
            ftps-legacy) url_scheme="ftps"; tls_flag="" ;;
            ftps)        url_scheme="ftp";  tls_flag="--ssl-reqd" ;;
            *)           url_scheme="ftp";  tls_flag="" ;;
          esac

          target_url="$url_scheme://$FTP_SERVER:$PORT/$FTP_SERVER_DIR"

          if ! listing=$(curl -sS --insecure $tls_flag --connect-timeout 30 \
            --user "$FTP_USERNAME:$FTP_PASSWORD" \
            --list-only "$target_url" 2>&1); then
            echo "::error::Cannot list the deployment target. Check FTP_SERVER_DIR as the deploy account sees it after login. curl said: ${listing}"
            exit 1
          fi

          if ! printf '%s\n' "$listing" | tr -d '\r' | grep -qE '(^|/)mm-project-tracker\.php$'; then
            echo "::error::The target does not contain mm-project-tracker.php. Correct FTP_SERVER_DIR, or use allow_create for a genuine first installation."
            exit 1
          fi

          echo "Target verified: mm-project-tracker.php is present."

      - name: Let the preflight FTP session close
        run: sleep 15

      - name: Sync changed plugin files
        id: sync
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.server-dir }}
          local-dir: ./mm-project-tracker/
          protocol: ${{ inputs.protocol || 'ftps' }}
          port: ${{ inputs.port || '21' }}
          security: loose
          log-level: ${{ inputs.log_level || 'standard' }}
          dangerous-clean-slate: false
          dry-run: ${{ inputs.dry_run || false }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/node_modules
            **/*.md
            *.md

      - name: Wait before retrying a failed sync
        if: steps.sync.outcome == 'failure'
        run: |
          echo "First attempt failed — waiting 60 seconds before retrying."
          sleep 60

      - name: Retry the sync
        if: steps.sync.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ steps.ftp.outputs.server-dir }}
          local-dir: ./mm-project-tracker/
          protocol: ${{ inputs.protocol || 'ftps' }}
          port: ${{ inputs.port || '21' }}
          security: loose
          log-level: ${{ inputs.log_level || 'standard' }}
          dangerous-clean-slate: false
          dry-run: ${{ inputs.dry_run || false }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/node_modules
            **/*.md
            *.md
